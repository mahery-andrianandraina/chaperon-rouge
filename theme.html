<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le thème</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Jost:wght@300;400;500&display=swap">
<style>
:root { --f-title: "IM Fell DW Pica", Georgia, serif; --f-ui: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; color: #fffaf0; font-family: var(--f-ui); overflow: hidden; background: #1b2a1d; }
/* Le monde a retrouvé ses couleurs : ciel, forêt, lumière dorée */
.sky { position: fixed; inset: 0; background: linear-gradient(180deg, #3f86ff 0%, #59b9ff 26%, #9be3c0 52%, #8fdc4a 72%, #ffd84a 90%, #ffb43a 100%); animation: rise 3s ease both; }
.sky::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 50% at 50% 78%, rgba(255, 246, 200, 0.85), transparent 70%); animation: breathe 6s ease-in-out infinite; }
.sky::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: linear-gradient(180deg, #3aa84a, #1f6a2e); clip-path: polygon(0 28%, 6% 20%, 12% 30%, 19% 18%, 27% 28%, 35% 16%, 44% 27%, 52% 17%, 61% 29%, 70% 19%, 78% 28%, 86% 18%, 94% 27%, 100% 20%, 100% 100%, 0 100%); }
@keyframes rise { from { filter: brightness(0.15) saturate(0.2); } to { filter: none; } }
@keyframes breathe { 50% { opacity: 0.7; } }
.dots { position: fixed; inset: 0; pointer-events: none; }
.dots i { position: absolute; border-radius: 50%; animation: float linear infinite; opacity: 0; box-shadow: 0 0 10px currentColor; background: currentColor; }
@keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 85% { opacity: 0.8; } 100% { transform: translateY(-38vh); opacity: 0; } }
main { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; padding: 24px; }
.stage { width: min(980px, 100%); display: grid; gap: clamp(14px, 3vh, 26px); justify-items: center; text-align: center; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 62vh; border-radius: 6px; overflow: hidden; background: rgba(10, 30, 12, 0.35); box-shadow: 0 20px 70px rgba(10, 40, 10, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.35); backdrop-filter: blur(6px); }
video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; opacity: 0; transition: opacity 0.6s; }
.frame.on video { opacity: 1; }
.play { position: absolute; inset: 0; margin: auto; width: clamp(84px, 16vw, 128px); height: clamp(84px, 16vw, 128px); border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: #fff7d6; color: #1f4d22; box-shadow: 0 0 0 10px rgba(255, 247, 214, 0.28), 0 0 60px rgba(255, 220, 90, 0.9); transition: transform 0.25s, box-shadow 0.25s, opacity 0.3s; animation: pulse 2.4s ease-in-out infinite; }
.play:hover:not(:disabled), .play:focus-visible:not(:disabled) { transform: scale(1.07); outline: none; box-shadow: 0 0 0 14px rgba(255, 247, 214, 0.4), 0 0 80px rgba(255, 220, 90, 1); }
.play:disabled { cursor: progress; animation: none; opacity: 0.7; }
.play svg { width: 42%; height: 42%; margin-left: 8%; }
@keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(255, 247, 214, 0.16), 0 0 70px rgba(255, 220, 90, 0.9); } }
.state { position: absolute; left: 0; right: 0; bottom: 14px; font: 400 0.8rem/1 var(--f-ui); letter-spacing: 0.26em; text-transform: uppercase; color: #fffaf0; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
.bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: rgba(255, 255, 255, 0.18); }
.bar i { display: block; height: 100%; width: 0; background: #fff7d6; box-shadow: 0 0 10px #fff; transition: width 0.4s; }
.label { margin: 0; font: 400 0.78rem/1.3 var(--f-ui); letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255, 255, 255, 0.92); text-shadow: 0 1px 8px rgba(0, 40, 0, 0.6); }
.theme { margin: 0; font: italic 400 clamp(2.2rem, 7vw, 5.6rem)/1.12 var(--f-title); color: #fffdf4; max-width: 16ch; text-wrap: balance; text-shadow: 0 3px 24px rgba(20, 70, 20, 0.7); }
.theme span { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(10px); animation: emerge 1.4s ease forwards; animation-delay: calc(var(--i) * 70ms + 300ms); }
@keyframes emerge { to { opacity: 1; filter: blur(0); transform: none; } }
.btn { min-height: 48px; padding: 0 24px; border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 2px; background: rgba(255, 255, 255, 0.18); color: #fff; cursor: pointer; font: 400 0.85rem/1 var(--f-ui); letter-spacing: 0.22em; text-transform: uppercase; backdrop-filter: blur(4px); }
.btn:hover, .btn:focus-visible { background: rgba(255, 255, 255, 0.34); outline: none; }
.hide { display: none; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
body.done .frame { display: none; }
@media (prefers-reduced-motion: reduce) { .sky, .sky::before, .dots i, .play { animation: none; } .theme span { animation-duration: 0.01s; animation-delay: 0s; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="dots" id="dots" aria-hidden="true"></div>
<main>
  <section class="stage">
    <p class="label" id="label">Une dernière chose</p>
    <div class="frame" id="frame">
      <video id="v" playsinline preload="auto" controls controlslist="nodownload"></video>
      <button class="play" id="play" type="button" aria-label="Lancer la vidéo" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
      <div class="state" id="state">Chargement de la vidéo</div>
      <div class="bar" id="barWrap"><i id="bar"></i></div>
    </div>
    <h1 class="theme" id="theme" hidden></h1>
    <button class="btn" id="again" type="button" hidden>Revoir la vidéo</button>
    <a class="btn" id="board" href="leaderboard.html" hidden>Voir le classement</a>
  </section>
</main>
<script>
/* Les valeurs viennent de quiz.html (?v=lien vidéo&t=thème). Valeurs de secours si la page est ouverte seule. */
var DEFAULT_VIDEO = "https://res.cloudinary.com/VOTRE_CLOUD/video/upload/VOTRE_VIDEO.mp4";
var DEFAULT_THEME = "Lobaka fotsy + Jean Bleu + Tennis Fotsy";
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var URLV = qs.get("v") || DEFAULT_VIDEO, THEME = qs.get("t") || DEFAULT_THEME;
  var v = $("v"), play = $("play"), frame = $("frame"), ready = false, started = false;

  /* lucioles colorées */
  (function () {
    var d = $("dots"), hues = [0, 20, 48, 300, 330, 210, 280, 120];
    for (var i = 0; i < 36; i++) {
      var e = document.createElement("i"), s = 3 + Math.random() * 5;
      e.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (45 + Math.random() * 50) + "%;width:" + s + "px;height:" + s + "px;color:hsl(" + hues[i % hues.length] + ",95%,68%);animation-duration:" + (7 + Math.random() * 9) + "s;animation-delay:" + (-Math.random() * 14) + "s";
      d.appendChild(e);
    }
  })();

  function showTheme() {
    document.body.classList.add("done");
    $("label").textContent = "Le thème";
    var h = $("theme"); h.hidden = false; h.textContent = ""; var n = 0;
    THEME.split(" ").forEach(function (w) {
      var word = document.createElement("span"); word.style.cssText = "display:inline-block;white-space:nowrap";
      Array.from(w).forEach(function (c) { var s = document.createElement("span"); s.textContent = c; s.style.setProperty("--i", n++); word.appendChild(s); });
      h.appendChild(word); h.appendChild(document.createTextNode(" "));
    });
    h.setAttribute("aria-label", THEME);
    $("again").hidden = !ready; $("board").hidden = false;
  }
  function enable() { if (ready) return; ready = true; play.disabled = false; $("state").textContent = "Vidéo prête  ·  appuyez pour lancer"; $("barWrap").style.display = "none"; }
  function fail() { if (started) return; ready = false; $("barWrap").style.display = "none"; showTheme(); }

  /* Chargement COMPLET avant lecture : la vidéo est téléchargée à 100 % (barre de progression), puis le bouton play se débloque.
     Ainsi, aucune pause en cours de lecture, même sur une connexion lente. */
  function setPct(p) { $("bar").style.width = p + "%"; $("state").textContent = "Chargement de la vidéo  " + Math.round(p) + " %"; }
  function ready100() { enable(); }
  function viaElement() {
    /* secours si le téléchargement direct est refusé (CORS) : on attend que le navigateur juge la lecture sans coupure possible */
    v.src = URLV; v.load();
    v.addEventListener("progress", function () { try { var b = v.buffered; if (b.length && v.duration) setPct(Math.min(100, b.end(b.length - 1) / v.duration * 100)); } catch (e) {} });
    v.addEventListener("canplaythrough", ready100); v.addEventListener("error", fail);
  }
  function download() {
    var ctrl = window.AbortController ? new AbortController() : null;
    fetch(URLV, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      var total = +r.headers.get("content-length") || 0, type = r.headers.get("content-type") || "video/mp4";
      if (!r.body || !r.body.getReader) return r.blob().then(function (bl) { return bl; });
      var rd = r.body.getReader(), parts = [], got = 0;
      if (!total) $("state").textContent = "Chargement de la vidéo";
      return (function pump() {
        return rd.read().then(function (x) {
          if (x.done) return new Blob(parts, { type: type });
          parts.push(x.value); got += x.value.length; if (total) setPct(Math.min(99, got / total * 100));
          return pump();
        });
      })();
    }).then(function (blob) {
      setPct(100);
      v.addEventListener("loadeddata", ready100, { once: true }); v.addEventListener("error", fail, { once: true });
      v.src = URL.createObjectURL(blob); v.load();
    }).catch(function (e) { if (e && /http (4|5)/.test(String(e.message))) fail(); else viaElement(); });
  }
  if (!URLV || /VOTRE_/.test(URLV)) { setTimeout(fail, 400); }
  else { setPct(0); download(); }

  function fs(el) {
    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (f) { try { var r = f.call(el); if (r && r.catch) r.catch(function () {}); return true; } catch (e) {} }
    if (v.webkitEnterFullscreen) { try { v.webkitEnterFullscreen(); return true; } catch (e) {} }
    return false;
  }
  function exitFs() { var f = document.exitFullscreen || document.webkitExitFullscreen; if (f && (document.fullscreenElement || document.webkitFullscreenElement)) { try { var r = f.call(document); if (r && r.catch) r.catch(function () {}); } catch (e) {} } }

  function start() {
    if (!ready) return;
    started = true; frame.classList.add("on"); play.style.display = "none"; $("state").style.display = "none";
    /* plein écran dans le même geste que le clic (obligatoire pour les navigateurs) */
    fs(frame.requestFullscreen || frame.webkitRequestFullscreen ? frame : v);
    var p = v.play(); if (p && p.catch) p.catch(function () { v.muted = true; v.play(); });
  }
  play.addEventListener("click", start);
  v.addEventListener("ended", function () { exitFs(); showTheme(); });
  $("again").addEventListener("click", function () {
    document.body.classList.remove("done"); $("theme").hidden = true; $("again").hidden = true; $("label").textContent = "Une dernière chose";
    v.currentTime = 0; start();
  });
})();
</script>
</body>
</html>
