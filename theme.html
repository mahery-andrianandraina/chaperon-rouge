<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le thème</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Jost:wght@300;400;500&display=swap">
<style>
:root { --f-title: "IM Fell DW Pica", Georgia, serif; --f-ui: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; color: #fffaf0; font-family: var(--f-ui); overflow: hidden; background: #1b2a1d; }
/* Le monde a retrouvé ses couleurs : ciel, forêt, lumière dorée */
.sky { position: fixed; inset: 13vh 0; background: linear-gradient(180deg, #080808 0%, #262626 34%, #6c6c6c 66%, #b5b5b5 100%); animation: rise 3s ease both; }
.sky::before { content: ""; position: absolute; inset: 0; background: radial-gradient(40% 38% at 84% 84%, rgba(255, 210, 110, 0.55), transparent 72%); animation: breathe 6s ease-in-out infinite; }
.wood { position: fixed; inset: 13vh 0; width: 100%; height: calc(100% - 26vh); pointer-events: none; animation: rise 3s ease both; }
.girl { position: fixed; right: 0; bottom: calc(13vh - 50px); width: 760px; height: 700px; pointer-events: none; z-index: 1; animation: rise 3s ease both; }
@media (max-width: 600px) { .girl { right: -70px; } }
.fog { position: fixed; inset: 13vh 0; overflow: hidden; pointer-events: none; filter: blur(18px); opacity: 0.5; background: radial-gradient(50% 40% at 20% 72%, rgba(210,210,210,0.5), transparent 70%), radial-gradient(60% 45% at 75% 60%, rgba(200,200,200,0.4), transparent 72%); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateX(6%) scale(1.08); } }
.lb { position: fixed; left: 0; right: 0; height: 13vh; background: #000; z-index: 3; animation: barin 1.4s cubic-bezier(.25,.6,.2,1) both; }
.lb.t { top: 0; } .lb.b { bottom: 0; }
@keyframes barin { from { height: 0; } }
@keyframes rise { from { filter: brightness(0.15) saturate(0.2); } to { filter: none; } }
@keyframes breathe { 50% { opacity: 0.7; } }
.dots { position: fixed; inset: 0; pointer-events: none; }
.dots i { position: absolute; border-radius: 50%; animation: float linear infinite; opacity: 0; box-shadow: 0 0 10px currentColor; background: currentColor; }
@keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 85% { opacity: 0.8; } 100% { transform: translateY(-38vh); opacity: 0; } }
main { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; padding: 14vh 24px; }
.stage { width: min(980px, 100%); display: grid; gap: clamp(8px, 2vh, 20px); justify-items: center; text-align: center; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 62vh; border-radius: 6px; overflow: hidden; background: rgba(10, 30, 12, 0.35); box-shadow: 0 20px 70px rgba(10, 40, 10, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.35); backdrop-filter: blur(6px); }
video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; opacity: 0; transition: opacity 0.6s; }
.frame.on video { opacity: 1; }
/* lecture « plein écran du navigateur » : la vidéo couvre toute la fenêtre de la page (pas de mode plein écran du système) */
.frame.theater { position: fixed; inset: 0; z-index: 100; width: 100vw; height: 100vh; max-height: none; aspect-ratio: auto; border-radius: 0; background: #000; box-shadow: none; backdrop-filter: none; }
.play { position: absolute; inset: 0; margin: auto; width: clamp(84px, 16vw, 128px); height: clamp(84px, 16vw, 128px); border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: #ececec; color: #0a0a0a; box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.16), 0 0 60px rgba(255, 214, 120, 0.55); transition: transform 0.25s, box-shadow 0.25s, opacity 0.3s; animation: pulse 2.4s ease-in-out infinite; }
.play:hover:not(:disabled), .play:focus-visible:not(:disabled) { transform: scale(1.07); outline: none; box-shadow: 0 0 0 14px rgba(255, 255, 255, 0.24), 0 0 80px rgba(255, 214, 120, 0.8); }
.play:disabled { cursor: progress; animation: none; opacity: 0.7; }
.play svg { width: 42%; height: 42%; margin-left: 8%; }
@keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.1), 0 0 70px rgba(255, 214, 120, 0.6); } }
.state { position: absolute; left: 0; right: 0; bottom: 14px; font: 400 0.8rem/1 var(--f-ui); letter-spacing: 0.26em; text-transform: uppercase; color: #fffaf0; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
.bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: rgba(255, 255, 255, 0.18); }
.bar i { display: block; height: 100%; width: 0; background: #f2f2f2; box-shadow: 0 0 10px #fff; transition: width 0.4s; }
.label { margin: 0; font: 400 0.8rem/1.3 var(--f-ui); letter-spacing: 0.4em; text-transform: uppercase; color: #fffaf0; text-shadow: 0 1px 3px rgba(40, 20, 10, 0.7), 0 0 14px rgba(40, 20, 10, 0.45); }
.theme { margin: 0; font: italic 400 clamp(1.9rem, min(7vw, 8.6vh), 5.6rem)/1.12 var(--f-title); color: #f6f6f6; max-width: 16ch; text-wrap: balance; text-shadow: 0 0 50px rgba(255, 255, 255, 0.25), 0 2px 18px #000; }
.theme span { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(10px); animation: emerge 1.4s ease forwards; animation-delay: calc(var(--i) * 70ms + 300ms); }
@keyframes emerge { 0% { opacity: 0; filter: blur(14px); transform: translateY(10px); color: #ffd76a; text-shadow: 0 0 30px rgba(255, 200, 70, 0.95); }
  45% { opacity: 1; filter: blur(0); transform: none; color: #fff3c4; text-shadow: 0 0 34px rgba(255, 210, 90, 0.95), 0 2px 18px #000; }
  100% { opacity: 1; filter: blur(0); transform: none; color: #f6f6f6; text-shadow: 0 0 50px rgba(255, 255, 255, 0.25), 0 2px 18px #000; } }
/* la lampe s'intensifie : un faisceau doré balaie l'écran de droite à gauche, et la forêt reprend des couleurs autour d'elle */
.tint { position: fixed; inset: 13vh 0; pointer-events: none; z-index: 0; mix-blend-mode: color; opacity: 0; overflow: hidden; }
.tint::before { content: ""; position: absolute; left: 86%; top: 88%; width: 190vmax; height: 190vmax; margin: -95vmax 0 0 -95vmax; border-radius: 50%; transform: scale(0.05);
  background: radial-gradient(closest-side, rgba(250, 190, 70, 0.95), rgba(120, 170, 80, 0.8) 38%, rgba(70, 120, 90, 0.55) 62%, transparent 100%); }
body.done .tint { opacity: 0.75; transition: opacity 2s ease 0.4s; }
body.done .tint::before { transform: scale(1); transition: transform 5s cubic-bezier(.2,.6,.3,1) 0.3s; }
.beam { position: fixed; inset: 13vh 0; pointer-events: none; z-index: 2; opacity: 0; overflow: hidden; }
.beam::before { content: ""; position: absolute; top: -10%; bottom: -10%; width: 38%; right: 0; transform: translateX(120%) skewX(-14deg);
  background: linear-gradient(90deg, transparent, rgba(255, 224, 140, 0.55) 50%, transparent); filter: blur(18px); }
body.done .beam { opacity: 1; }
body.done .beam::before { animation: sweep 2.8s cubic-bezier(.4,.1,.3,1) 0.3s forwards; }
@keyframes sweep { from { transform: translateX(120%) skewX(-14deg); } to { transform: translateX(-320%) skewX(-14deg); } }
.recap { margin: 0; font: 400 0.85rem/1.4 var(--f-ui); letter-spacing: 0.3em; text-transform: uppercase; color: #f2f2f2; text-shadow: 0 1px 10px #000, 0 0 18px #000; opacity: 0; animation: fadeup 1.4s ease 2.6s forwards; }
.recap b { font-weight: 500; color: #fff3c4; }
.quote { margin: 0; max-width: 34ch; font: italic 400 clamp(1.05rem, 2.4vw, 1.5rem)/1.45 var(--f-title); color: #fff3c4; text-shadow: 0 2px 14px #000, 0 0 24px rgba(0, 0, 0, 0.8); opacity: 0; animation: fadeup 1.6s ease 3.6s forwards; }
.acts { display: flex; flex-wrap: wrap; gap: 14px 22px; justify-content: center; align-items: center; opacity: 0; animation: fadeup 1.4s ease 4.4s forwards; }
.ghost { min-height: 50px; padding: 0 6px; border: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.55); background: transparent; color: #f2f2f2; cursor: pointer; font: 400 0.8rem/1 var(--f-ui); letter-spacing: 0.22em; text-transform: uppercase; text-shadow: 0 1px 8px #000; }
.ghost:hover, .ghost:focus-visible { border-bottom-color: #fff; color: #fff; outline: none; }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.btn { min-height: 50px; padding: 0 30px; border: 1px solid #fff; border-radius: 2px; background: #ececec; color: #0a0a0a; cursor: pointer; font: 400 0.85rem/1 var(--f-ui); letter-spacing: 0.22em; text-transform: uppercase; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55); transition: background 0.2s; }
.btn:hover, .btn:focus-visible { background: #fff; outline: none; }
.hide { display: none; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
body.done .frame { display: none; }
@media (prefers-reduced-motion: reduce) { .sky, .sky::before, .wood, .fog, .lb, .dots i, .play { animation: none; } .theme span { animation-duration: 0.01s; animation-delay: 0s; } .recap, .quote, .acts { animation-duration: 0.01s; animation-delay: 0s; } .beam::before { animation: none; } }
</style>
</head>
